# Netlify configuration file

[build]
  # Clean install ALL dependencies (including dev) and build
  command = "rm -rf node_modules && npm ci --include=dev && npm run build"
  publish = "dist"

# Environment variables for production
[context.production.environment]
  VITE_API_URL = "https://siam.devwooyou.space/api"

# Environment variables for deploy previews
[context.deploy-preview.environment]
  VITE_API_URL = "https://siam.devwooyou.space/api"

# Environment variables for branch deploys
[context.branch-deploy.environment]
  VITE_API_URL = "https://siam.devwooyou.space/api"

# Redirect rules for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
